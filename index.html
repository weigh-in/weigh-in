<script>
  // Decides which copy of the app to load, so a new version is never stuck behind an old saved copy.
  // The ?v=N in a link wins, then the version this phone last updated to, then a fresh copy every 5 minutes.
  (function () {
    var v = "", stored = 0;
    try { stored = parseInt(localStorage.getItem("weighin-appv"), 10) || 0; } catch (e) {}
    try { v = new URLSearchParams(location.search).get("v") || ""; } catch (e) {}
    var n = parseInt(v, 10);
    if (n > stored) { stored = n; try { localStorage.setItem("weighin-appv", String(n)); } catch (e) {} }
    if (!v) v = stored ? String(stored) : "t" + Math.floor(Date.now() / 300000);
    window.__appv = v;
    document.write('<link rel="stylesheet" href="style.css?v=' + encodeURIComponent(v) + '">');
  })();
</script>

<script>
  // The loading scene lives in its own sealed box (shadow DOM), so no change to the app's styles can alter the animation.
  (function () {
    var h = document.getElementById("boot-cast"), t = document.getElementById("bs-tpl");
    if (!h || !t || !h.attachShadow) return;
    h.removeAttribute("style"); h.textContent = "";
    h.style.cssText = "display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;height:100%;font-family:var(--display, Georgia, serif);color:var(--lake, #1F5C4D)";
    h.attachShadow({ mode: "open" }).appendChild(t.content.cloneNode(true));
  })();
</script>

<script>
  // Casting animation: one clock drives the man, rod, line and bobber so everything stays attached.
  (function () {
    var host = document.getElementById("boot-cast"), sr = host && host.shadowRoot;
    if (!sr) return;
    var $ = function (id) { return sr.getElementById(id); };
    if (!$("bs-rod")) return;
    var up = $("bs-up"), arm1 = $("bs-arm1"), arm2 = $("bs-arm2"), h1 = $("bs-h1"), h2 = $("bs-h2"),
        handle = $("bs-handle"), shaft = $("bs-shaft"), reel = $("bs-reel"), line = $("bs-line"), bob = $("bs-bob"), fish = $("bs-fish"),
        r1 = $("bs-r1"), r2 = $("bs-r2"), jf = $("bs-jf"), jr = $("bs-jr"), b0 = $("bs-bird0"), b1 = $("bs-bird1"),
        ds = [0, 1, 2, 3, 4].map(function (i) { return $("bs-d" + i); });
    var T = [0, .08, .30, .36, .50, .90, 1], A = [-60, -63, -135, -135, -10, -8, -60];
    var LOOP = 4500, PX = 92, PY = 112, LEN = 64, LX = 255, LY = 152, REL = .44, LAND = .72;
    var DV = [[-30, -85], [-14, -105], [2, -115], [16, -100], [32, -80]];
    function sm(x) { return x * x * (3 - 2 * x); }
    function cl(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
    function ang(t) { t = cl(t); for (var i = 0; i < T.length - 1; i++) if (t <= T[i + 1]) return A[i] + (A[i + 1] - A[i]) * sm((t - T[i]) / (T[i + 1] - T[i])); return A[A.length - 1]; }
    function omega(t) { return (ang(t + .004) - ang(t - .004)) / .008; }
    function f1(x) { return x.toFixed(1); }
    var still = false; // Always plays: it is a short loading screen, and phones with "remove animations" on would otherwise freeze it.
    function rodPose(t) {
      var a = ang(t), rad = a * Math.PI / 180, dx = Math.cos(rad), dy = Math.sin(rad), nx = -dy, ny = dx;
      var bend = -omega(t) * .0075; if (t > REL) bend += 3.2 * Math.sin((t - REL) * 260) * Math.exp(-(t - REL) * 28);
      bend = Math.max(-16, Math.min(16, bend));
      var hx = PX + (a + 60) * .06, hy = PY;
      return { a: a, dx: dx, dy: dy, nx: nx, ny: ny, bend: bend, hx: hx, hy: hy,
        tx: hx + LEN * dx + nx * bend, ty: hy + LEN * dy + ny * bend };
    }
    function hang(t) {
      var p = rodPose(t), phi = Math.max(-.45, Math.min(.45, -omega(t) * .00018)) + Math.sin(t * 40) * .03;
      return { x: p.tx + 17 * Math.sin(phi), y: p.ty + 17 * Math.cos(phi), phi: phi };
    }
    var R = hang(REL);
    function frame(ms) {
      if (!host.isConnected) return;
      var tf = ms / LOOP, t = Math.min(tf, .9), ph = tf % 1, s = ms / 1000; // casts once, then the bobber keeps floating
      var p = rodPose(t), lean = (p.a + 60) * .07 + Math.sin(ph * 12.566) * .5;
      up.setAttribute("transform", "rotate(" + lean.toFixed(2) + " 85 122)");
      var lr = lean * Math.PI / 180, sx0 = 88 - 85, sy0 = 99 - 122;
      var sx = 85 + sx0 * Math.cos(lr) - sy0 * Math.sin(lr), sy = 122 + sx0 * Math.sin(lr) + sy0 * Math.cos(lr);
      var fx = p.hx - 8 * p.dx, fy = p.hy - 8 * p.dy;
      arm1.setAttribute("d", "M" + f1(sx - 1) + " " + f1(sy) + " Q" + f1((sx + fx) / 2 - 3) + " " + f1((sy + fy) / 2 + 8) + " " + f1(fx) + " " + f1(fy));
      arm2.setAttribute("d", "M" + f1(sx) + " " + f1(sy) + " Q" + f1((sx + p.hx) / 2 - 2) + " " + f1((sy + p.hy) / 2 + 7) + " " + f1(p.hx) + " " + f1(p.hy));
      h1.setAttribute("cx", f1(fx)); h1.setAttribute("cy", f1(fy)); h2.setAttribute("cx", f1(p.hx)); h2.setAttribute("cy", f1(p.hy));
      handle.setAttribute("x1", f1(p.hx - 8 * p.dx)); handle.setAttribute("y1", f1(p.hy - 8 * p.dy));
      handle.setAttribute("x2", f1(p.hx + 14 * p.dx)); handle.setAttribute("y2", f1(p.hy + 14 * p.dy));
      var b = p.bend;
      shaft.setAttribute("d", "M" + f1(p.hx + 14 * p.dx) + " " + f1(p.hy + 14 * p.dy) + " Q" + f1(p.hx + (LEN / 2 + 7) * p.dx + p.nx * b * .35) + " " + f1(p.hy + (LEN / 2 + 7) * p.dy + p.ny * b * .35) + " " + f1(p.tx) + " " + f1(p.ty));
      reel.setAttribute("cx", f1(p.hx + 9 * p.dx + p.nx * 4.2)); reel.setAttribute("cy", f1(p.hy + 9 * p.dy + p.ny * 4.2));
      var bx, by, sag, rot = 0;
      if (t < REL) { var hg = hang(t); bx = hg.x; by = hg.y; sag = 0; rot = hg.phi * 30; }
      else if (t < LAND) {
        var u = (t - REL) / (LAND - REL);
        var e = 1 - Math.pow(1 - u, 1.7); bx = R.x + (LX - R.x) * e; by = R.y + (LY - R.y) * u - 82 * 4 * u * (1 - u); sag = 14 * u; rot = (u - .5) * 120;
      } else {
        var k = t - LAND, tug = Math.exp(-Math.pow((ph - .85) / .012, 2));
        bx = LX + Math.sin(k * 90) * .6; by = LY - 1.2 + Math.sin(k * 120) * 1.5 * Math.exp(-k * 9) + Math.sin(ph * 12.566) * .5 + tug * 3.4; sag = 13; rot = Math.sin(k * 80) * 6 * Math.exp(-k * 8);
      }
      // The bobber's top (where the line ties on) always points along the line back to the rod, and it stands upright once it floats.
      var rT = Math.atan2(p.tx - bx, -(p.ty - by)) * 180 / Math.PI, wf = t < LAND ? 0 : sm(cl((t - LAND) / .05)), wob = t >= LAND ? rot : 0;
      rot = rT * (1 - wf) + wob * wf;
      var ax = bx + Math.sin(rot * Math.PI / 180) * 9.5, ay = by - Math.cos(rot * Math.PI / 180) * 9.5;
      var mx = (p.tx + ax) / 2, my = (p.ty + ay) / 2 + sag;
      line.setAttribute("d", "M" + f1(p.tx) + " " + f1(p.ty) + " Q" + f1(mx) + " " + f1(my) + " " + f1(ax) + " " + f1(ay));
      bob.setAttribute("transform", "translate(" + f1(bx) + " " + f1(by) + ") rotate(" + f1(rot) + ")");
      fish.setAttribute("opacity", 1);
      var s1 = cl((t - LAND) / .17), s2 = cl((t - LAND - .035) / .17);
      r1.setAttribute("rx", f1(2 + 20 * s1)); r1.setAttribute("ry", f1(.8 + 5.5 * s1)); r1.setAttribute("opacity", t > LAND && t < LAND + .17 && t < .9 ? (.9 * (1 - s1)).toFixed(2) : 0);
      r2.setAttribute("rx", f1(2 + 32 * s2)); r2.setAttribute("ry", f1(.8 + 9 * s2)); r2.setAttribute("opacity", t > LAND + .035 && t < LAND + .205 ? (.7 * (1 - s2)).toFixed(2) : 0);
      var tt = (t - LAND) * LOOP / 1000;
      for (var i = 0; i < 5; i++) {
        var on = t > LAND && tt < .8, d = ds[i];
        d.setAttribute("cx", f1(LX + DV[i][0] * tt)); d.setAttribute("cy", f1(LY - 2 + DV[i][1] * tt + 150 * tt * tt));
        d.setAttribute("opacity", on ? (1 - tt / .8).toFixed(2) : 0);
      }
      var fu = (t - .50) / .13;
      if (fu > 0 && fu < 1) {
        var fx2 = 168 + 34 * fu, fy2 = 158 - 30 * 4 * fu * (1 - fu), ang2 = Math.atan2(-30 * 4 * (1 - 2 * fu), 34) * 180 / Math.PI;
        jf.setAttribute("transform", "translate(" + f1(fx2) + " " + f1(fy2) + ") rotate(" + f1(ang2) + ")"); jf.setAttribute("opacity", 1);
      } else jf.setAttribute("opacity", 0);
      var ju = cl((t - .63) / .14);
      jr.setAttribute("rx", f1(1 + 15 * ju)); jr.setAttribute("ry", f1(.5 + 4 * ju)); jr.setAttribute("opacity", t > .63 && t < .77 ? (.8 * (1 - ju)).toFixed(2) : 0);
      var w0 = Math.sin(ph * 62.83) * .8 + .2, w1 = Math.sin(ph * 56.55 + 1) * .8 + .2, x0 = ((ph * 380 + 40) % 380) - 30, x1 = ((ph * 380 + 190) % 380) - 30;
      b0.setAttribute("d", "M" + f1(x0 - 5) + " " + f1(36 - w0 * 3) + " Q" + f1(x0 - 2.5) + " " + f1(36 - 5 * w0 - 2) + " " + f1(x0) + " 36 Q" + f1(x0 + 2.5) + " " + f1(36 - 5 * w0 - 2) + " " + f1(x0 + 5) + " " + f1(36 - w0 * 3));
      b1.setAttribute("d", "M" + f1(x1 - 4) + " " + f1(54 - w1 * 2.5) + " Q" + f1(x1 - 2) + " " + f1(54 - 4 * w1 - 1.5) + " " + f1(x1) + " 54 Q" + f1(x1 + 2) + " " + f1(54 - 4 * w1 - 1.5) + " " + f1(x1 + 4) + " " + f1(54 - w1 * 2.5));
      if (!still) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>
<script>
  // Only on the old GitHub address: tell people Weigh-In has a new home.
