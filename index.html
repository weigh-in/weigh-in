<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weigh-In</title>
<meta name="description" content="Weigh-In is a free fishing app. Post your catches, run tournaments, check river levels and the bite forecast, and chat with friends.">
<meta name="theme-color" content="#1F5C4D">
<meta property="og:title" content="Weigh-In">
<meta property="og:description" content="Post catches, run fishing tournaments, check rivers and the bite forecast.">
<meta property="og:image" content="https://weigh-in.github.io/weigh-in/bobber-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weigh-In">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="bobber-192.png">
<link rel="apple-touch-icon" href="bobber-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<script>
  // Decides which copy of the app to load, so a new version is never stuck behind an old saved copy.
  // The ?v=N in a link wins, then the version this phone last updated to, then a fresh copy every 5 minutes.
  (function () {
    var v = "", stored = 0;
    try { stored = parseInt(localStorage.getItem("weighin-appv"), 10) || 0; } catch (e) {}
    try { v = new URLSearchParams(location.search).get("v") || ""; } catch (e) {}
    var n = parseInt(v, 10);
    if (n > stored) { stored = n; try { localStorage.setItem("weighin-appv", String(n)); } catch (e) {} }
    if (!v) v = stored ? String(stored) : "t" + Math.floor(Date.now() / 300000);
    window.__appv = v;
    document.write('<link rel="stylesheet" href="style.css?v=' + encodeURIComponent(v) + '">');
  })();
</script>
</head>
<body>
<div id="app">
  <div class="boot">Loading Weigh-In…</div>
  <noscript><p style="padding:24px;color:#fff">Weigh-In needs JavaScript turned on to work.</p></noscript>
</div>
<script>
  // Only on the old GitHub address: tell people Weigh-In has a new home.
  (function () {
    if (!/\.github\.io$/.test(location.hostname)) return;
    try { if (sessionStorage.getItem("weighin-moved-hide")) return; } catch (e) {}
    var NEW = "https://weighin-app.pages.dev/";
    var o = document.createElement("div");
    o.setAttribute("role", "dialog"); o.setAttribute("aria-label", "Weigh-In has moved");
    o.style.cssText = "position:fixed;inset:0;z-index:99999;background:#10322A;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Barlow,system-ui,sans-serif;text-align:center";
    o.innerHTML = '<div style="max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center">'
      + '<img src="bobber-192.png" alt="" width="84" height="84" style="border-radius:20px">'
      + '<h1 style="margin:0;font-size:1.9rem">We have moved!</h1>'
      + '<p style="margin:0;font-size:1.1rem;line-height:1.5">Weigh-In has a new home. Your account, catches and friends are all there waiting.</p>'
      + '<a id="moved-go" href="' + NEW + '" style="display:block;width:100%;box-sizing:border-box;background:#E8742A;color:#fff;font-weight:700;font-size:1.15rem;padding:16px;border-radius:12px;text-decoration:none">Go to the new Weigh-In</a>'
      + '<p style="margin:0;font-size:.95rem;opacity:.85;word-break:break-all">' + NEW.replace("https://", "") + '</p>'
      + '<button id="moved-stay" type="button" style="background:none;border:0;color:#fff;opacity:.8;text-decoration:underline;font:inherit;padding:8px;cursor:pointer">Stay on this page for now</button></div>';
    function show() { document.body.appendChild(o); document.getElementById("moved-stay").onclick = function () { try { sessionStorage.setItem("weighin-moved-hide", "1"); } catch (e) {} o.remove(); }; }
    if (document.body) show(); else document.addEventListener("DOMContentLoaded", show);
  })();
</script>
<datalist id="species">
  <option>Largemouth Bass</option><option>Smallmouth Bass</option><option>Spotted Bass</option>
  <option>Striped Bass</option><option>White Bass</option><option>Hybrid Striped Bass</option>
  <option>Crappie</option><option>Bluegill</option><option>Redear Sunfish</option>
  <option>Channel Catfish</option><option>Blue Catfish</option><option>Flathead Catfish</option>
  <option>Walleye</option><option>Sauger</option><option>Northern Pike</option><option>Muskie</option>
  <option>Rainbow Trout</option><option>Brown Trout</option><option>Paddlefish</option>
  <option>Common Carp</option><option>Freshwater Drum</option><option>Gar</option>
  <option>Redfish</option><option>Speckled Trout</option><option>Flounder</option>
</datalist>
<datalist id="lures">
  <option>Plastic worm</option><option>Crankbait</option><option>Spinnerbait</option><option>Jig</option>
  <option>Topwater</option><option>Swimbait</option><option>Jerkbait</option><option>Chatterbait</option>
  <option>Spoon</option><option>Inline spinner</option><option>Fly</option><option>Live minnow</option>
  <option>Nightcrawler</option><option>Cut bait</option><option>Chicken liver</option>
</datalist>
<script>
  (function () {
    var m = document.createElement("script"); m.type = "module"; m.src = "app.js?v=" + encodeURIComponent(window.__appv || "");
    document.body.appendChild(m);
  })();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
