<script>
  // Decides which copy of the app to load, so a new version is never stuck behind an old saved copy.
  // The ?v=N in a link wins, then the version this phone last updated to, then a fresh copy every 5 minutes.
  (function () {
    var v = "", stored = 0;
    try { stored = parseInt(localStorage.getItem("weighin-appv"), 10) || 0; } catch (e) {}
    try { v = new URLSearchParams(location.search).get("v") || ""; } catch (e) {}
    var n = parseInt(v, 10);
    if (n > stored) { stored = n; try { localStorage.setItem("weighin-appv", String(n)); } catch (e) {} }
    if (!v) v = stored ? String(stored) : "t" + Math.floor(Date.now() / 300000);
    window.__appv = v;
    document.write('<link rel="stylesheet" href="style.css?v=' + encodeURIComponent(v) + '">');
  })();
</script>

<script>
  // Casting animation: one clock drives the rod, line and bobber so the line always stays attached.
  (function () {
    var rod = document.getElementById("bs-rod"); if (!rod) return;
    var line = document.getElementById("bs-line"), b1 = document.getElementById("bs-b1"), b2 = document.getElementById("bs-b2"),
        fish = document.getElementById("bs-fish"), r1 = document.getElementById("bs-r1"), r2 = document.getElementById("bs-r2");
    var T = [0, .15, .38, .5, .56, .93, 1], A = [-60, -60, -130, -25, -12, -12, -60], LOOP = 3600;
    var PX = 92, PY = 112, LEN = 64, LX = 250, LY = 148;
    function sm(x) { return x * x * (3 - 2 * x); }
    function angle(t) { for (var i = 0; i < T.length - 1; i++) if (t <= T[i + 1]) return A[i] + (A[i + 1] - A[i]) * sm((t - T[i]) / (T[i + 1] - T[i])); return A[A.length - 1]; }
    function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
    var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    function frame(ms) {
      if (!document.getElementById("bs-rod")) return;
      var t = still ? .9 : (ms % LOOP) / LOOP, a = angle(t), rad = a * Math.PI / 180;
      var tx = PX + LEN * Math.cos(rad), ty = PY + LEN * Math.sin(rad), bx, by, sag;
      if (t < .5) { bx = tx + Math.sin(t * 14) * 1.5; by = ty + 17; sag = 0; }
      else if (t < .78) { var u = (t - .5) / .28, e = u * u * (3 - 2 * u) * .4 + u * .6; bx = tx + (LX - tx) * e; by = ty + (LY - ty) * u - 80 * 4 * u * (1 - u); sag = 12 * u; }
      else { bx = LX; by = LY + Math.sin((t - .78) * 30) * 1.2; sag = 12; }
      var r = tx + (bx - tx) / 2, c = ty + (by - ty) / 2 + sag;
      rod.setAttribute("transform", "rotate(" + a.toFixed(2) + " " + PX + " " + PY + ")");
      line.setAttribute("d", "M" + tx.toFixed(1) + " " + ty.toFixed(1) + " Q" + r.toFixed(1) + " " + c.toFixed(1) + " " + bx.toFixed(1) + " " + by.toFixed(1));
      b1.setAttribute("cx", bx); b1.setAttribute("cy", by + 1.5); b2.setAttribute("cx", bx); b2.setAttribute("cy", by - 1.5);
      fish.setAttribute("opacity", t > .93 ? clamp(1 - (t - .93) / .04) : 1);
      var s1 = clamp((t - .78) / .14), s2 = clamp((t - .82) / .14);
      r1.setAttribute("rx", 2 + 18 * s1); r1.setAttribute("ry", 1 + 5 * s1); r1.setAttribute("opacity", t > .78 && t < .93 ? .9 * (1 - s1) : 0);
      r2.setAttribute("rx", 2 + 28 * s2); r2.setAttribute("ry", 1 + 8 * s2); r2.setAttribute("opacity", t > .82 && t < .97 ? .7 * (1 - s2) : 0);
      if (!still) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>
<script>
  // Only on the old GitHub address: tell people Weigh-In has a new home.
  (function () {
    if (!/\.github\.io$/.test(location.hostname)) return;
    var NEW = "https://weighin-app.pages.dev/";
    var o = document.createElement("div");
    o.setAttribute("role", "dialog"); o.setAttribute("aria-label", "Weigh-In has moved");
    o.style.cssText = "position:fixed;inset:0;z-index:99999;background:#10322A;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Barlow,system-ui,sans-serif;text-align:center";
    o.innerHTML = '<div style="max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center">'
      + '<img src="bobber-192.png" alt="" width="84" height="84" style="border-radius:20px">'
      + '<h1 style="margin:0;font-size:1.9rem">We have moved!</h1>'
      + '<p style="margin:0;font-size:1.1rem;line-height:1.5">Weigh-In has a new home. Your account, catches and friends are all there waiting.</p>'
      + '<a id="moved-go" href="' + NEW + '" style="display:block;width:100%;box-sizing:border-box;background:#E8742A;color:#fff;font-weight:700;font-size:1.15rem;padding:16px;border-radius:12px;text-decoration:none">Go to the new Weigh-In</a>'
      + '<p style="margin:0;font-size:.95rem;opacity:.85;word-break:break-all">' + NEW.replace("https://", "") + '</p>'
      + '</div>';
    function show() { document.body.appendChild(o); }
    if (document.body) show(); else document.addEventListener("DOMContentLoaded", show);
  })();
</script>
